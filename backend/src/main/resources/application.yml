server:
  port: ${PORT:8080}

spring:
  application:
    name: clickkaar-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    test-connection: false
    properties:
      mail.debug: false
      mail.debug.auth: false
      mail.smtp.auth: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
      mail.smtp.ssl.enable: false
      mail.smtp.ssl.protocols: TLSv1.2
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.trust: ${MAIL_HOST:smtp.gmail.com}
      
  

app:
  frontend:
    login-url: ${FRONTEND_LOGIN_URL:https://click-kaar.com/login}
  jwt:
    secret: ${JWT_SECRET:replace-this-with-a-very-long-secret-key-for-dev-only}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,http://localhost:4204,http://localhost:4205,http://localhost:4206,http://127.0.0.1:4200,http://127.0.0.1:4201,http://127.0.0.1:4202,http://127.0.0.1:4203,http://127.0.0.1:4204,http://127.0.0.1:4205,http://127.0.0.1:4206}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:}
    key-secret: ${RAZORPAY_KEY_SECRET:}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
