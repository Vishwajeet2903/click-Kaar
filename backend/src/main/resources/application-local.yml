spring:
  datasource:
    url: "${LOCAL_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/clickkaar?createDatabaseIfNotExist=true&sslMode=DISABLED&allowPublicKeyRetrieval=true}}"
    username: ${LOCAL_DB_USERNAME:${DB_USERNAME:root}}
    password: ${LOCAL_DB_PASSWORD:${DB_PASSWORD:root}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:4201,http://localhost:4202,http://localhost:4203,http://localhost:4204,http://localhost:4205,http://localhost:4206,http://127.0.0.1:4200,http://127.0.0.1:4201,http://127.0.0.1:4202,http://127.0.0.1:4203,http://127.0.0.1:4204,http://127.0.0.1:4205,http://127.0.0.1:4206
