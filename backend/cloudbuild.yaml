substitutions:
  _REGION: asia-south1
  _REPOSITORY: clickkaar
  _SERVICE: clickkaar-backend
  _CORS_ALLOWED_ORIGINS: https://clickkaar.com
  _FRONTEND_LOGIN_URL: https://clickkaar.com/login
  _DB_URL_SECRET: clickkaar-db-url
  _DB_USERNAME_SECRET: clickkaar-db-username
  _DB_PASSWORD_SECRET: clickkaar-db-password
  _JWT_SECRET_SECRET: clickkaar-jwt-secret

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - services
      - enable
      - secretmanager.googleapis.com

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -c
      - |
        PROJECT_NUMBER="$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
        gcloud projects add-iam-policy-binding "$PROJECT_ID" \
          --member="serviceAccount:$${PROJECT_NUMBER}-compute@developer.gserviceaccount.com" \
          --role="roles/secretmanager.secretAccessor" \
          --quiet

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA
      - --region
      - ${_REGION}
      - --platform
      - managed
      - --allow-unauthenticated
      - --memory
      - 1Gi
      - --cpu
      - "1"
      - --set-env-vars
      - ^@^SPRING_PROFILES_ACTIVE=cloud@CORS_ALLOWED_ORIGINS=${_CORS_ALLOWED_ORIGINS}@FRONTEND_LOGIN_URL=${_FRONTEND_LOGIN_URL}
      - --set-secrets
      - DB_URL=${_DB_URL_SECRET}:latest,DB_USERNAME=${_DB_USERNAME_SECRET}:latest,DB_PASSWORD=${_DB_PASSWORD_SECRET}:latest,JWT_SECRET=${_JWT_SECRET_SECRET}:latest

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
